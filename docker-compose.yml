services:
  agent-hive:
    build: .
    image: agent-hive:latest
    restart: unless-stopped
    init: true
    ports:
      - "${HIVE_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HIVE_PORT: "8000"
      HIVE_DB_PATH: /data/agents.db
      HIVE_WORKSPACE: /data/workspace
      HIVE_ALLOW_PYTHON: "${HIVE_ALLOW_PYTHON:-false}"
      HIVE_API_TOKEN: "${HIVE_API_TOKEN:-}"
    volumes:
      - hive_data:/data
      # Uncomment to mount a custom config.toml from your host:
      # - ./config.toml:/app/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    develop:
      watch:
        - action: sync+restart
          path: ./hive
          target: /app/hive
          ignore:
            - __pycache__/
            - "**/*.pyc"
        - action: sync+restart
          path: ./main.py
          target: /app/main.py
        - action: sync+restart
          path: ./config.toml.example
          target: /app/config.toml.example
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./Dockerfile

  cli:
    build: .
    image: agent-hive:latest
    profiles: ["cli"]
    init: true
    stdin_open: true
    tty: true
    command: ["python", "main.py"]
    env_file:
      - path: .env
        required: false
    environment:
      HIVE_DB_PATH: /data/agents.db
      HIVE_WORKSPACE: /data/workspace
      HIVE_ALLOW_PYTHON: "${HIVE_ALLOW_PYTHON:-false}"
    volumes:
      - hive_data:/data
      # - ./config.toml:/app/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true

volumes:
  hive_data:
